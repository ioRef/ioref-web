[project]
name = "ioref-web"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "django-environ>=0.14.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "markdown>=3.10.3",
    "nh3>=0.3.7",
    "pyyaml>=6.0.3",
    "whitenoise>=6.12.0",
]

[tool.ruff.lint]
# Explicit rather than left to ruff's defaults. Those have broadened over
# time -- 0.16 enables RUF, DTZ, B and more out of the box -- so relying on
# them means a version bump can fail the build with no code change behind it.
# E501 is left out on purpose: ruff format owns line length.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The settings modules layer with `from .base import *`, which is the Django
# idiom for the pattern and the reason F403/F405 fire here.
"config/settings/*.py" = ["F403", "F405"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "ruff>=0.16.9,<0.17",
]
